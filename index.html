<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Smart - The Class Magazine</title>
  <meta name="description" content="Intensive English III - Universidad Nacional de Colombia, Bogotá">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Book Smart - The Class Magazine">
  <meta property="og:description" content="Intensive English III - Universidad Nacional de Colombia, Bogotá">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Book Smart - The Class Magazine">
  <meta name="twitter:description" content="Intensive English III - Universidad Nacional de Colombia, Bogotá">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ecece9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#18181a" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <!-- Runs before the first paint, on every page:
       1. applies a saved light/dark choice, so nobody sees a flash of the wrong one;
       2. if the reader just clicked an issue, puts that issue's colour over the page
          (the arriving half of the page transition, see css/components/curtain.css)
          and flags the page as arriving, so its entrance waits for the curtain. -->
  <script>
    (function (d) {
      try {
        var t = localStorage.getItem('magazine:theme');
        if (t === 'light' || t === 'dark') d.dataset.theme = t;
      } catch (e) {}
      try {
        var n = JSON.parse(sessionStorage.getItem('bs:nav') || 'null');
        sessionStorage.removeItem('bs:nav');
        if (n && n.hue && Date.now() - n.t < 6000) {
          var c = d.appendChild(document.createElement('div'));
          c.className = 'curtain curtain--arriving';
          c.setAttribute('aria-hidden', 'true');
          c.style.backgroundColor = n.hue;
          d.classList.add('is-arriving');
        }
      } catch (e) {}
    })(document.documentElement);
  </script>

  <link rel="stylesheet" href="css/main.css">
  <!-- Classic scripts, in this order: no ES modules, so the page works when
       index.html is opened by double click. -->
  <script defer src="js/vendor/gsap.min.js"></script>
  <script defer src="js/vendor/ScrollTrigger.min.js"></script>
  <script defer src="js/data/articles.js"></script>
  <script defer src="js/core.js"></script>
  <script defer src="js/home.js"></script>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html">Book Smart</a>
      <div class="site-header__tools">
        <nav aria-label="Main">
          <ul class="nav" role="list">
            <li><a class="nav__link" href="index.html" aria-current="page">Home</a></li>
            <li><a class="nav__link" href="archive.html">Archive</a></li>
          </ul>
        </nav>
        <button class="btn btn--ghost btn--icon" data-theme-toggle type="button" aria-label="Switch theme"></button>
      </div>
    </div>
  </header>

  <main id="content">

    <!-- ============ MASTHEAD ============
         The name of the magazine as large as the screen allows, typed here in
         plain HTML so it is the first thing to paint, and it enters with a
         pure-CSS animation (each letter carries its own --i for the stagger),
         so nothing depends on a script. It is sized in container-query units
         (css/pages/home.css). The button is filled from the manifest by
         js/home.js; what is written here is only what shows if JavaScript is
         off. -->
    <section class="hero" aria-label="Book Smart">
      <div class="container hero__inner">
        <h1 class="mast" aria-label="Book Smart"><span class="mast__word" aria-hidden="true"><span style="--i:0">B</span><span style="--i:1">o</span><span style="--i:2">o</span><span style="--i:3">k</span></span> <span class="mast__word" aria-hidden="true"><span style="--i:4">S</span><span style="--i:5">m</span><span style="--i:6">a</span><span style="--i:7">r</span><span style="--i:8">t</span></span></h1>
        <div class="hero__row">
          <p class="hero__stand">Intensive English III - Universidad Nacional de Colombia, Bogotá</p>
          <a class="btn hero__cta" href="articles/2026-w07-our-top-5s.html" data-latest><span data-latest-label>Read Week 07</span></a>
        </div>
      </div>
    </section>

    <!-- ============ THE SHELF ============
         Every issue, newest first, built from the manifest by js/home.js
         (js/data/articles.js is the only file touched to publish). -->
    <section class="shelf" data-shelf aria-labelledby="shelf-title">
      <h2 class="visually-hidden" id="shelf-title">Issues, newest first</h2>
      <div class="shelf__viewport" data-shelf-viewport>
        <ol class="shelf__track" data-shelf-track role="list"></ol>
      </div>
      <div class="shelf__progress" aria-hidden="true"><span class="shelf__bar" data-shelf-bar></span></div>
      <noscript>
        <p class="container empty-state">Enable JavaScript to browse the issues, or go straight to the
          <a href="articles/2026-w07-our-top-5s.html">latest article</a>.</p>
      </noscript>
    </section>

  </main>

  <footer class="site-footer">
    <nav class="legend" aria-label="Sections" data-legend>
      <noscript><a class="legend__item" href="archive.html"><span class="legend__name">Browse by section</span></a></noscript>
    </nav>
    <div class="container site-footer__inner">
      <p class="site-footer__name">Book Smart</p>
      <p class="site-footer__info">Intensive English III<br>Universidad Nacional de Colombia, Bogot&aacute;<br>Semester 2026-2</p>
      <a class="site-footer__top" href="#top" data-top>Back to top</a>
    </div>
  </footer>
</body>
</html>
