<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The four sections in their muted hues: indigo, ocre, terracotta, sage.
       The browser tab is dark or light on its own, so the squares switch to the
       lighter night tones on a dark tab strip (the same pairs as css/base/tokens.css). -->
  <style>
    .e { fill: #3a4a96; }
    .c { fill: #725311; }
    .p { fill: #94412c; }
    .h { fill: #44603f; }
    @media (prefers-color-scheme: dark) {
      .e { fill: #9aa3dc; }
      .c { fill: #cca35c; }
      .p { fill: #d28a70; }
      .h { fill: #9db79a; }
    }
  </style>
  <rect class="e" width="32" height="32"/>
  <rect class="c" x="32" width="32" height="32"/>
  <rect class="p" y="32" width="32" height="32"/>
  <rect class="h" x="32" y="32" width="32" height="32"/>
</svg>
