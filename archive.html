<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archive - Book Smart</title>
  <meta name="description" content="Every assignment of the semester, filterable by section, week and keyword.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Archive - Book Smart">
  <meta property="og:description" content="Every assignment of the semester, filterable by section, week and keyword.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Archive - Book Smart">
  <meta name="twitter:description" content="Every assignment of the semester, filterable by section, week and keyword.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ecece9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#18181a" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <!-- Runs before the first paint, on every page:
       1. applies a saved light/dark choice, so nobody sees a flash of the wrong one;
       2. if the reader just clicked an issue, puts that issue's colour over the page
          (the arriving half of the page transition, see css/components/curtain.css)
          and flags the page as arriving, so its entrance waits for the curtain. -->
  <script>
    (function (d) {
      try {
        var t = localStorage.getItem('magazine:theme');
        if (t === 'light' || t === 'dark') d.dataset.theme = t;
      } catch (e) {}
      try {
        var n = JSON.parse(sessionStorage.getItem('bs:nav') || 'null');
        sessionStorage.removeItem('bs:nav');
        if (n && n.hue && Date.now() - n.t < 6000) {
          var c = d.appendChild(document.createElement('div'));
          c.className = 'curtain curtain--arriving';
          c.setAttribute('aria-hidden', 'true');
          c.style.backgroundColor = n.hue;
          d.classList.add('is-arriving');
        }
      } catch (e) {}
    })(document.documentElement);
  </script>

  <link rel="stylesheet" href="css/main.css">
  <script defer src="js/vendor/gsap.min.js"></script>
  <script defer src="js/vendor/ScrollTrigger.min.js"></script>
  <script defer src="js/vendor/Flip.min.js"></script>
  <script defer src="js/data/articles.js"></script>
  <script defer src="js/core.js"></script>
  <script defer src="js/archive.js"></script>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html">Book Smart</a>
      <div class="site-header__tools">
        <nav aria-label="Main">
          <ul class="nav" role="list">
            <li><a class="nav__link" href="index.html">Home</a></li>
            <li><a class="nav__link" href="archive.html" aria-current="page">Archive</a></li>
          </ul>
        </nav>
        <button class="btn btn--ghost btn--icon" data-theme-toggle type="button" aria-label="Switch theme"></button>
      </div>
    </div>
  </header>

  <main id="content">
    <header class="archive-head container">
      <h1 class="archive-head__title">Archive</h1>
    </header>

    <div class="container layout-archive">

      <!-- THE ONLY PLACE CATEGORIES APPEAR AS CONTROLS.
           Every chip below is generated by js/archive.js from SECTIONS and from
           the weeks present in the manifest, so this markup never lists a
           category by name. -->
      <aside class="layout-archive__sidebar" aria-label="Filters">
        <form class="filters" role="search" onsubmit="return false;">
          <div class="filters__group">
            <label class="filters__label" for="search">Search</label>
            <input class="field" id="search" type="search" data-search placeholder="Title, author or topic">
          </div>

          <div class="filters__group">
            <p class="filters__label" id="group-section">Section</p>
            <div class="cluster" data-filter="section" role="group" aria-labelledby="group-section"></div>
          </div>

          <div class="filters__group">
            <p class="filters__label" id="group-week">Week</p>
            <div class="cluster" data-filter="week" role="group" aria-labelledby="group-week"></div>
          </div>

          <div class="filters__group">
            <label class="filters__label" for="sort">Sort by</label>
            <select class="field" id="sort" data-sort></select>
          </div>
        </form>
      </aside>

      <section aria-labelledby="results-title">
        <h2 class="visually-hidden" id="results-title">Results</h2>
        <div class="layout-archive__results-bar">
          <p class="results-count" data-results-count aria-live="polite"></p>
          <button class="btn btn--ghost" data-clear-filters type="button" hidden>Clear filters</button>
        </div>
        <div class="archive-grid" data-archive-grid></div>
        <noscript>
          <p class="empty-state">Enable JavaScript to filter the archive.</p>
        </noscript>
      </section>

    </div>
  </main>

  <footer class="site-footer">
    <nav class="legend" aria-label="Sections" data-legend>
      <noscript><a class="legend__item" href="archive.html"><span class="legend__name">Browse by section</span></a></noscript>
    </nav>
    <div class="container site-footer__inner">
      <p class="site-footer__name">Book Smart</p>
      <p class="site-footer__info">Intensive English III<br>Universidad Nacional de Colombia, Bogot&aacute;<br>Semester 2026-2</p>
      <a class="site-footer__top" href="#top" data-top>Back to top</a>
    </div>
  </footer>
</body>
</html>
